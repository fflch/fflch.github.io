services:
  cursodrupal:
    build: .
    image: cursodrupal:latest
    container_name: cursodrupal
    ports:
      - "8000:80"
    depends_on:
      - mariadb
    networks:
      - cursodrupal-network
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
    user: "${UID:-1000}:${GID:-1000}"

  mariadb:
    image: mariadb:11
    container_name: cursodrupal_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: cursodrupal
      MYSQL_USER: cursodrupal
      MYSQL_PASSWORD: cursodrupal
      MYSQL_ROOT_PASSWORD: cursodrupal
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - cursodrupal-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cursodrupal_phpmyadmin
    restart: always
    depends_on:
      - mariadb
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: cursodrupal
    networks:
      - cursodrupal-network
      
  # No /etc/hosts do seu computador colocar a linha `127.0.0.1 auth.local` 
  # particularidades do protocolo oAuth1 usado na USP
  senhaunica-faker:
    image: uspdev/senhaunica-faker
    container_name: cursodrupal_senhaunica-faker
    ports:
      - "3141:3141"
    environment:
          - APP_URL=http://auth.local:3141
    networks:
      cursodrupal-network:
        aliases:
          - auth.local

  selenium:
    image: selenium/standalone-chrome
    container_name: cursodrupal_selenium
    ports:
      - "7900:7900"
    networks:
      - cursodrupal-network
    shm_size: 2gb

  mailpit:
    image: axllent/mailpit:latest
    container_name: cursodrupal_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface Web
    networks:
      - cursodrupal-network

networks:
  cursodrupal-network:

volumes:
  mariadb_data: