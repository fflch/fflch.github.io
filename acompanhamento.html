<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Acompanhamento - TI FFLCH</title>
    
<style>
:root {
    --surface: #ffffff;
    --surface-2: #f6f6f4;
    --border: #e0dfda;
    --text-primary: #111;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --accent: #2a78d6;
    --good-bg: #e6f4ea;     --good-fg: #146c2e;     --good-line: #2e9d4f;
    --warning-bg: #fff4d6;  --warning-fg: #7a5200;  --warning-line: #e0a800;
    --critical-bg: #fde3e3; --critical-fg: #a11b1b; --critical-line: #d93a3a;
    --info-bg: #e8f0fb;     --info-fg: #1d4f91;     --info-line: #2a78d6;
    --change-bg: #fff8e1;   --change-border: #e0a800;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --surface: #1a1a19; --surface-2: #242423; --border: #3a3a38;
        --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f; --accent: #3987e5;
        --good-bg: #173a22; --good-fg: #8fd6a2; --good-line: #3fb466;
        --warning-bg: #3d3010; --warning-fg: #f2c95c; --warning-line: #c98500;
        --critical-bg: #4a1a1a; --critical-fg: #f29b9b; --critical-line: #e66767;
        --info-bg: #182c47; --info-fg: #9cc2f2; --info-line: #3987e5;
        --change-bg: #352c10; --change-border: #c98500;
    }
}
:root[data-theme="dark"] {
    --surface: #1a1a19; --surface-2: #242423; --border: #3a3a38;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f; --accent: #3987e5;
    --good-bg: #173a22; --good-fg: #8fd6a2; --good-line: #3fb466;
    --warning-bg: #3d3010; --warning-fg: #f2c95c; --warning-line: #c98500;
    --critical-bg: #4a1a1a; --critical-fg: #f29b9b; --critical-line: #e66767;
    --info-bg: #182c47; --info-fg: #9cc2f2; --info-line: #3987e5;
    --change-bg: #352c10; --change-border: #c98500;
}
body { background: var(--surface); color: var(--text-primary); }
a { color: var(--accent); }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
nav.lateral { background: var(--surface-2); border-right: 1px solid var(--border); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
nav.lateral a.item { display: flex; justify-content: space-between; gap: 6px; padding: 5px 10px; border-radius: 6px; color: var(--text-primary); text-decoration: none; font-size: .9rem; border: 2px solid transparent; }
nav.lateral a.item:hover { background: var(--border); }
nav.lateral a.item.ativo { background: var(--accent); color: #fff; }
nav.lateral a.item.alvo { border: 2px dashed var(--accent); }
nav.lateral a.item.alvo-sobre { background: var(--info-bg); color: var(--info-fg); }
nav.lateral .grupo { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin: 14px 10px 4px; }
nav.lateral .cont { font-variant-numeric: tabular-nums; opacity: .85; }
nav.lateral .cont.mudou::before { content: "● "; color: var(--change-border); }
.painel-mudancas { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
.painel-mudancas .btn { width: 100%; }
.painel-mudancas .status { font-size: .8rem; color: var(--text-secondary); margin-bottom: 6px; }
main { padding: 28px 32px; max-width: 1200px; }
.sub { color: var(--text-secondary); font-size: .9rem; }

/* cabeçalho enxuto da pessoa */
.cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 6px; }
.cab h1 { margin: 0; }
.numeros { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--text-secondary); font-size: .9rem; margin: 6px 0 4px; }
.numeros b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 18px; }

.pill { display: inline-block; font-size: .78rem; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--text-secondary); }
.p-good { background: var(--good-bg); color: var(--good-fg); }
.p-warning { background: var(--warning-bg); color: var(--warning-fg); }
.p-critical { background: var(--critical-bg); color: var(--critical-fg); }
.p-info { background: var(--info-bg); color: var(--info-fg); }
.mud { background: var(--change-bg); color: var(--text-primary); border: 1px solid var(--change-border); }

/* barra de ferramentas + zona de fechar */
.barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; margin-bottom: 14px; position: sticky; top: 0; background: var(--surface); padding: 8px 0; z-index: 5; }
.zona-fechar { flex: 1; min-width: 220px; border: 2px dashed var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: .9rem; padding: 8px; transition: all .15s; }
.zona-fechar.ativa { border-color: var(--good-line); color: var(--good-fg); background: var(--good-bg); }
.zona-fechar.sobre { background: var(--good-line); color: #fff; }

/* cards */
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card-issue { background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.05); cursor: grab; }
.card-issue:active { cursor: grabbing; }
.card-issue.arrastando { opacity: .45; }
.card-issue.f-recente { border-left-color: var(--good-line); }
.card-issue.f-andamento { border-left-color: var(--info-line); }
.card-issue.f-atencao { border-left-color: var(--warning-line); }
.card-issue.f-parada { border-left-color: var(--critical-line); }
.card-issue.alterada { background: var(--change-bg); }
.card-issue.fechada { opacity: .6; }
.card-issue.fechada .desc { text-decoration: line-through; }
.card-issue .topo { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card-issue .cod { font-weight: 700; }
.card-issue .tarefa { font-size: .82rem; color: var(--text-secondary); }
.card-issue .desc { font-size: .93rem; line-height: 1.4; }
.card-issue .antes { color: var(--text-muted); text-decoration: line-through; font-size: .82rem; }
.card-issue .rodape { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: auto; flex-wrap: wrap; }
.card-issue .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.botoes { display: flex; gap: 2px; }
.botoes button { border: 1px solid transparent; background: none; border-radius: 6px; padding: 2px 7px; color: var(--text-secondary); font-size: .95rem; line-height: 1.4; }
.botoes button:hover { border-color: var(--border); background: var(--surface-2); color: var(--text-primary); }
.editor { border-top: 1px dashed var(--border); padding-top: 8px; cursor: default; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: .8rem; cursor: pointer; }
.ultimo-coment { font-size: .82rem; color: var(--text-secondary); border-left: 2px solid var(--border); padding-left: 8px; }
.lista-coment { list-style: none; padding: 0; margin: 0 0 8px; font-size: .85rem; max-height: 220px; overflow-y: auto; }
.lista-coment li { padding: 4px 0; border-bottom: 1px dashed var(--border); white-space: pre-line; }
.secao { margin: 26px 0 10px; font-size: 1rem; font-weight: 600; color: var(--text-secondary); }

table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.t th, table.t td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t th { color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
table.t td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.clicavel { cursor: pointer; }
table.t tr.clicavel:hover td { background: var(--surface-2); }
.zero { color: var(--text-muted); }
.cel-atencao { color: var(--warning-fg); font-weight: 600; }
.cel-parada { color: var(--critical-fg); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
.kpi { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.kpi .v { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .l { font-size: .8rem; color: var(--text-secondary); }
details.bloco { border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; margin: 10px 0; }
details.bloco > summary { cursor: pointer; color: var(--text-secondary); }
.form-control, .form-select { background-color: var(--surface); color: var(--text-primary); border-color: var(--border); }
#toast { position: fixed; bottom: 20px; right: 20px; background: var(--text-primary); color: var(--surface); padding: 8px 14px; border-radius: 8px; display: none; z-index: 20; }

@media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    nav.lateral { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    main { padding: 20px 16px; }
}
@media print {
    nav.lateral, .no-print, .barra { display: none !important; }
    .layout { display: block; }
    main { padding: 0; max-width: none; }
}
</style>

</head>

<script>
(function () {
    "use strict";
    var D = JSON.parse(document.getElementById("dados").textContent);
    var CHAVE = "acomp:mudancas:v1";
    var CHAVE_FILTRO = "acomp:filtro:v2";
    var VINCULO = { servidor: "Funcionário(a)", estagiario: "Estagiário(a)" };

    var issuesBase = {};
    D.issues.forEach(function (i) { issuesBase[i.codigo] = i; });
    var tarefas = {};
    D.tarefas.forEach(function (t) { tarefas[t.codigo] = t; });
    var nomesPessoas = D.pessoas.map(function (p) { return p.nome; });

    var editor = null;   // {issue, acao} — editor aberto dentro de um card
    var arrastando = null;

    // ---------------- armazenamento (somente neste navegador) ----------------
    function lerStorage(k, padrao) {
        try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; }
    }
    function gravarStorage(k, v) {
        try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast("Não foi possível salvar no navegador"); }
    }

    // mudancas[codigo] = {antes, depois, em}   (issue existente)
    // mudancas["nova-…"] = {nova: true, depois: {tarefa, descricao, responsavel}, em}
    var mudancas = lerStorage(CHAVE, {});

    // remove do navegador o que já foi aplicado no repositório
    (function limparAplicadas() {
        var removidas = 0;
        Object.keys(mudancas).forEach(function (cod) {
            var m = mudancas[cod], d = m.depois || {}, aplicada;
            if (m.nova) {
                aplicada = D.issues.some(function (i) {
                    return i.tarefa === d.tarefa && i.descricao === d.descricao && i.responsavel === (d.responsavel || "");
                });
            } else {
                var b = issuesBase[cod];
                aplicada = !b || (!d.fechar && !d.tarefa
                    && (d.responsavel === undefined || d.responsavel === b.responsavel)
                    && (d.descricao === undefined || d.descricao === b.descricao)
                    && (d.comentarios || []).every(function (t) {
                        return (b.comentarios || []).some(function (c) { return c.texto === t; });
                    }));
            }
            if (aplicada) { delete mudancas[cod]; removidas++; }
        });
        if (removidas) {
            gravarStorage(CHAVE, mudancas);
            setTimeout(function () { toast(removidas + " mudança(s) já aplicada(s) removida(s) do navegador"); }, 300);
        }
    })();

    function salvar() { gravarStorage(CHAVE, mudancas); }
    function totalMudancas() { return Object.keys(mudancas).length; }

    function registrar(cod, campo, valor) {
        var m = mudancas[cod];
        if (m && m.nova) {                      // issue nova: edita direto
            if (campo === "fechar") { delete mudancas[cod]; salvar(); return; }
            m.depois[campo] = valor === undefined ? (campo === "responsavel" ? "" : m.depois[campo]) : valor;
            salvar();
            return;
        }
        var base = issuesBase[cod];
        m = m || { antes: { responsavel: base.responsavel, descricao: base.descricao, tarefa: base.tarefa }, depois: {} };
        var igualBase = campo === "fechar" ? !valor : valor === base[campo];
        if (valor === undefined || igualBase) delete m.depois[campo]; else m.depois[campo] = valor;
        m.em = D.hoje;
        if (Object.keys(m.depois).length) mudancas[cod] = m; else delete mudancas[cod];
        salvar();
    }
    function desfazer(cod) { delete mudancas[cod]; salvar(); }

    // comentários: ficam em depois.comentarios (lista de textos) até serem aplicados no terminal
    function adicionarComentario(cod, texto) {
        var m = mudancas[cod];
        if (!m) {
            var base = issuesBase[cod];
            m = { antes: { responsavel: base.responsavel, descricao: base.descricao, tarefa: base.tarefa }, depois: {} };
        }
        m.depois.comentarios = (m.depois.comentarios || []).concat([texto]);
        if (!m.nova) m.em = D.hoje;
        mudancas[cod] = m;
        salvar();
    }
    function removerComentario(cod, idx) {
        var m = mudancas[cod];
        if (!m || !m.depois.comentarios) return;
        m.depois.comentarios.splice(idx, 1);
        if (!m.depois.comentarios.length) delete m.depois.comentarios;
        if (!m.nova && !Object.keys(m.depois).length) delete mudancas[cod];
        salvar();
    }

    function novaIssue(tarefa, descricao, responsavel) {
        var cod = "nova-" + Date.now();
        mudancas[cod] = { nova: true, depois: { tarefa: tarefa, descricao: descricao, responsavel: responsavel || "" }, em: D.hoje };
        salvar();
        return cod;
    }

    // ---------------- estado efetivo ----------------
    // Códigos que as issues novas/movidas vão receber: próximo número livre da tarefa
    // (maior número já usado + 1). Mesma ordem do bin/aplicar_mudancas.py:
    // primeiro as movidas, depois as novas, cada grupo na ordem do arquivo baixado.
    var PREVISTOS = {};
    function codigosPrevistos() {
        var usados = {}, out = {};
        Object.keys(D.ultimo || {}).forEach(function (t) { usados[t] = D.ultimo[t]; });
        function reservar(t) { usados[t] = (usados[t] || 0) + 1; return t + "-" + usados[t]; }
        var chaves = Object.keys(mudancas).sort();
        chaves.forEach(function (k) {
            var m = mudancas[k];
            if (!m.nova && issuesBase[k] && m.depois.tarefa) out[k] = reservar(m.depois.tarefa);
        });
        chaves.forEach(function (k) {
            var m = mudancas[k];
            if (m.nova && tarefas[m.depois.tarefa]) out[k] = reservar(m.depois.tarefa);
        });
        return out;
    }

    function efetiva(cod) {
        var m = mudancas[cod] || {}, d = m.depois || {};
        if (m.nova) {
            return { codigo: cod, nova: true, base: { tarefa: d.tarefa, descricao: d.descricao, responsavel: "" },
                     responsavel: d.responsavel || "", descricao: d.descricao, tarefa: d.tarefa, fechar: false,
                     idade: 0, data: D.hoje.split("-").reverse().join("/"), alterada: true, depois: {},
                     comentarios: [], novosComentarios: d.comentarios || [] };
        }
        var b = issuesBase[cod];
        return {
            codigo: cod, base: b,
            responsavel: d.responsavel !== undefined ? d.responsavel : b.responsavel,
            descricao: d.descricao !== undefined ? d.descricao : b.descricao,
            tarefa: d.tarefa || b.tarefa,
            fechar: !!d.fechar, idade: b.idade, data: b.data,
            alterada: !!mudancas[cod], depois: d,
            comentarios: b.comentarios || [], novosComentarios: d.comentarios || []
        };
    }
    function todas() {
        var lista = D.issues.map(function (i) { return efetiva(i.codigo); });
        Object.keys(mudancas).forEach(function (c) { if (mudancas[c].nova) lista.push(efetiva(c)); });
        return lista;
    }
    function porIdade(a, b) {
        if (!!a.nova !== !!b.nova) return a.nova ? -1 : 1;   // issues novas primeiro
        return (b.idade === null ? -1 : b.idade) - (a.idade === null ? -1 : a.idade);
    }

    function faixa(idade) {
        if (idade === null || idade === undefined) return "sem";
        if (idade <= 30) return "recente";
        if (idade <= 90) return "andamento";
        if (idade <= 180) return "atencao";
        return "parada";
    }

    function resumoPessoa(nome) {
        var lista = todas().filter(function (i) { return i.responsavel === nome; });
        var abertas = lista.filter(function (i) { return !i.fechar; });
        var c = { recente: 0, andamento: 0, atencao: 0, parada: 0, sem: 0 };
        abertas.forEach(function (i) { c[faixa(i.idade)]++; });
        var maisAntiga = abertas.reduce(function (m, i) { return i.idade !== null && i.idade > m ? i.idade : m; }, -1);
        return {
            lista: lista.sort(porIdade), abertas: abertas, c: c,
            maisAntiga: maisAntiga >= 0 ? maisAntiga : null,
            alteradas: lista.filter(function (i) { return i.alterada; }).length,
            prioridade: c.parada * 3 + c.atencao * 2 + abertas.length
        };
    }

    function pessoasFiltradas() {
        var f = document.getElementById("filtro-vinculo").value;
        return D.pessoas.filter(function (p) { return f === "todos" || p.vinculo === f; });
    }

    // ---------------- utilidades ----------------
    function esc(s) {
        return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }
    function toast(msg) {
        var t = document.getElementById("toast");
        t.textContent = msg; t.style.display = "block";
        clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = "none"; }, 2400);
    }
    function pillIdade(i) {
        if (i.nova) return '<span class="pill p-info">nova</span>';
        var f = faixa(i.idade);
        if (f === "sem") return '<span class="pill">sem data</span>';
        var cls = { recente: "p-good", andamento: "p-info", atencao: "p-warning", parada: "p-critical" }[f];
        var txt = { recente: "✓ " + i.idade + " dias", andamento: i.idade + " dias",
                    atencao: "⚠ " + i.idade + " dias", parada: "⛔ " + i.idade + " dias" }[f];
        return '<span class="pill ' + cls + '" title="Aberta em ' + esc(i.data) + '">' + txt + "</span>";
    }
    function tituloTarefa(cod) { return tarefas[cod] ? tarefas[cod].titulo : ""; }
    // ---------------- card de issue ----------------
    function card(i, mostrarResp) {
        var b = i.base, d = i.depois;
        var cls = ["card-issue", "f-" + faixa(i.idade), i.alterada ? "alterada" : "", i.fechar ? "fechada" : ""].join(" ");
        var h = '<div class="' + cls + '" draggable="true" data-card="' + esc(i.codigo) + '">';

        var prev = PREVISTOS[i.codigo];
        var codHtml = i.nova
            ? esc(prev || "nova") + ' <small class="zero">(nova)</small>'
            : (prev ? '<span class="antes">' + esc(i.codigo) + "</span> → " + esc(prev) : esc(i.codigo));
        h += '<div class="topo"><div><span class="cod" title="' + (prev ? "Código previsto; confirmado ao aplicar no terminal" : "") + '">'
            + codHtml + "</span></div>" + pillIdade(i) + "</div>";
        h += '<div class="tarefa">' + (d.tarefa ? '<span class="antes">' + esc(b.tarefa) + "</span> → " : "")
            + '<a href="index.html#' + esc(i.tarefa) + '">' + esc(i.tarefa) + "</a> · " + esc(tituloTarefa(i.tarefa)) + "</div>";
        h += '<div class="desc">' + esc(i.descricao) + "</div>";
        if (d.descricao !== undefined) h += '<div class="antes">' + esc(b.descricao) + "</div>";
        if (mostrarResp) h += '<div class="tarefa">👤 ' + esc(i.responsavel || "sem responsável") + "</div>";
        var ultimo = i.novosComentarios.length ? { data: "novo", texto: i.novosComentarios[i.novosComentarios.length - 1] }
                   : i.comentarios[i.comentarios.length - 1];
        if (ultimo && !(editor && editor.issue === i.codigo)) {
            h += '<div class="ultimo-coment" title="Último comentário">💬 <span class="zero">' + esc(ultimo.data) + "</span> " + esc(corta(ultimo.texto, 110)) + "</div>";
        }

        if (editor && editor.issue === i.codigo) {
            h += editorHtml(i);
        } else {
            var tags = [];
            if (i.nova) tags.push("será criada");
            if (d.responsavel !== undefined) tags.push((b.responsavel ? "de " + b.responsavel.split(" ")[0] + " " : "") + "→ " + (d.responsavel ? d.responsavel.split(" ")[0] : "ninguém"));
            if (d.descricao !== undefined) tags.push("descrição editada");
            if (d.tarefa) tags.push("mudou de tarefa");
            if (d.fechar) tags.push("✓ será fechada");
            if (i.novosComentarios.length) tags.push("💬 " + i.novosComentarios.length + " comentário(s) novo(s)");
            h += '<div class="rodape"><div class="tags">'
                + tags.map(function (t) { return '<span class="pill mud">' + esc(t) + "</span>"; }).join("")
                + (i.alterada ? ' <button type="button" class="link-btn" data-desfazer="' + esc(i.codigo) + '">desfazer</button>' : "")
                + '</div><div class="botoes no-print">'
                + '<button type="button" data-acao="comentar" data-issue="' + esc(i.codigo) + '" title="Comentários">💬'
                + ((i.comentarios.length + i.novosComentarios.length) ? '<small> ' + (i.comentarios.length + i.novosComentarios.length) + "</small>" : "") + "</button>"
                + '<button type="button" data-acao="editar" data-issue="' + esc(i.codigo) + '" title="Editar issue">✎</button>'
                + '<button type="button" data-acao="atribuir" data-issue="' + esc(i.codigo) + '" title="Atribuir a outra pessoa">👤</button>'
                + '<button type="button" data-acao="mover" data-issue="' + esc(i.codigo) + '" title="Mudar de tarefa">⇄</button>'
                + '<button type="button" data-acao="' + (i.fechar ? "reabrir" : "fechar") + '" data-issue="' + esc(i.codigo) + '" title="'
                + (i.fechar ? "Não fechar" : "Fechar issue") + '">' + (i.fechar ? "↺" : "✓") + "</button>"
                + "</div></div>";
        }
        return h + "</div>";
    }

    // ---------------- autocomplete (datalist nativo) ----------------
    function campoTarefa(id, valor, preferidas, rotulo) {
        var pref = (preferidas || []).filter(function (c) { return tarefas[c]; });
        var ordem = pref.concat(D.tarefas.map(function (t) { return t.codigo; }).filter(function (c) { return pref.indexOf(c) < 0; }));
        return '<label class="small" for="' + id + '">' + rotulo + "</label>"
            + '<input class="form-control form-control-sm" id="' + id + '" list="' + id + '-dl" autocomplete="off" value="' + esc(valor || "")
            + '" placeholder="digite o código ou parte do título (ex: dev005, grafica)">'
            + '<datalist id="' + id + '-dl">' + ordem.map(function (c) { return '<option value="' + esc(c + " - " + tituloTarefa(c)) + '">'; }).join("") + "</datalist>";
    }
    function campoPessoa(id, valor, tarefa, rotulo) {
        var sug = (tarefas[tarefa] || { pessoas: [] }).pessoas;
        var ordem = sug.concat(nomesPessoas.filter(function (n) { return sug.indexOf(n) < 0; }));
        return '<label class="small" for="' + id + '">' + rotulo + "</label>"
            + '<input class="form-control form-control-sm" id="' + id + '" list="' + id + '-dl" autocomplete="off" value="' + esc(valor || "")
            + '" placeholder="digite parte do nome (vazio = sem responsável)">'
            + '<datalist id="' + id + '-dl">' + ordem.map(function (n) { return '<option value="' + esc(n) + '">'; }).join("") + "</datalist>";
    }
    // devolve o código da tarefa a partir do texto digitado, ou null
    function resolverTarefa(txt) {
        txt = (txt || "").trim();
        if (!txt) return null;
        var cod = txt.split(" - ")[0].trim().toLowerCase();
        if (tarefas[cod]) return cod;
        var achadas = D.tarefas.filter(function (x) { return (x.codigo + " " + x.titulo).toLowerCase().indexOf(txt.toLowerCase()) >= 0; });
        return achadas.length === 1 ? achadas[0].codigo : null;
    }
    // devolve o nome completo ("" = sem responsável), ou null se não reconhecido
    function resolverPessoa(txt) {
        txt = (txt || "").trim();
        if (!txt) return "";
        if (nomesPessoas.indexOf(txt) >= 0) return txt;
        var achados = nomesPessoas.filter(function (n) { return n.toLowerCase().indexOf(txt.toLowerCase()) >= 0; });
        return achados.length === 1 ? achados[0] : null;
    }

    function corta(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

    function editorComentarios(i) {
        var h = '<div class="editor"><div class="small fw-bold mb-1">Comentários</div>';
        if (!i.comentarios.length && !i.novosComentarios.length) h += '<div class="zero small mb-2">Nenhum comentário ainda.</div>';
        h += '<ul class="lista-coment">';
        i.comentarios.forEach(function (c) {
            h += '<li><span class="zero">' + esc(c.data) + "</span> " + esc(c.texto) + "</li>";
        });
        i.novosComentarios.forEach(function (t, idx) {
            h += '<li class="novo"><span class="pill mud">novo</span> ' + esc(t)
               + ' <button type="button" class="link-btn" data-rmcom="' + idx + '" data-issue="' + esc(i.codigo) + '">remover</button></li>';
        });
        h += "</ul>"
           + '<textarea class="form-control form-control-sm" id="ed-valor" rows="3" placeholder="Escreva um comentário…"></textarea>'
           + '<div class="mt-2 d-flex gap-2"><button type="button" class="btn btn-sm btn-primary" data-ed="comentar">Adicionar comentário</button>'
           + '<button type="button" class="btn btn-sm btn-outline-secondary" data-ed="cancelar">Fechar</button></div></div>';
        return h;
    }

    function editorHtml(i) {
        if (editor.acao === "comentar") return editorComentarios(i);
        var h = '<div class="editor">';
        if (editor.acao === "atribuir") {
            h += campoPessoa("ed-valor", "", i.tarefa, "Atribuir a" + (i.responsavel ? " (hoje: " + esc(i.responsavel) + ")" : ""));
        } else if (editor.acao === "editar") {
            h += '<label class="small">Descrição</label><textarea class="form-control form-control-sm" id="ed-valor" rows="4">' + esc(i.descricao) + "</textarea>";
        } else if (editor.acao === "mover") {
            var pref = [];
            D.pessoas.forEach(function (p) { if (p.nome === i.responsavel) pref = p.atividades.map(function (a) { return a.codigo; }); });
            h += campoTarefa("ed-valor", "", pref.filter(function (c) { return c !== i.tarefa; }), "Mudar para a tarefa (hoje: " + esc(i.tarefa) + ")");
        }
        return h + '<div class="mt-2 d-flex gap-2"><button type="button" class="btn btn-sm btn-primary" data-ed="ok">Confirmar</button>'
            + '<button type="button" class="btn btn-sm btn-outline-secondary" data-ed="cancelar">Cancelar</button></div></div>';
    }

    function grade(lista, mostrarResp) {
        if (!lista.length) return '<p class="sub">Nenhuma issue.</p>';
        return '<div class="grade">' + lista.map(function (i) { return card(i, mostrarResp); }).join("") + "</div>";
    }

    function barra(comNova) {
        return '<div class="barra no-print">'
            + (comNova ? '<button type="button" class="btn btn-sm btn-success" data-nova="1">+ Nova issue</button>' : "")
            + '<div class="zona-fechar" id="zona-fechar">✓ Arraste um card para cá para fechar · solte sobre um nome no menu para reatribuir</div></div>';
    }

    function formNova(p) {
        if (!editor || editor.acao !== "nova") return "";
        var pref = p ? p.atividades.map(function (a) { return a.codigo; }) : [];
        return '<div class="card-issue alterada mb-3" style="cursor:default;max-width:560px">'
            + "<strong>Nova issue</strong>"
            + campoTarefa("nova-tarefa", "", pref, "Tarefa")
            + '<label class="small" for="nova-desc">Descrição</label><textarea class="form-control form-control-sm" id="nova-desc" rows="3" placeholder="O que precisa ser feito?"></textarea>'
            + campoPessoa("nova-resp", p ? p.nome : "", null, "Responsável")
            + '<div class="d-flex gap-2"><button type="button" class="btn btn-sm btn-primary" data-ed="criar">Criar</button>'
            + '<button type="button" class="btn btn-sm btn-outline-secondary" data-ed="cancelar">Cancelar</button></div></div>';
    }

    // ---------------- vistas ----------------
    function vistaEquipe() {
        var lista = pessoasFiltradas().map(function (p) { return { p: p, r: resumoPessoa(p.nome) }; })
            .sort(function (a, b) { return b.r.prioridade - a.r.prioridade || a.p.nome.localeCompare(b.p.nome); });
        var tot = { abertas: 0, atencao: 0, parada: 0 };
        lista.forEach(function (x) { tot.abertas += x.r.abertas.length; tot.atencao += x.r.c.atencao; tot.parada += x.r.c.parada; });
        var semResp = todas().filter(function (i) { return !i.responsavel && !i.fechar; }).length;
        var filtro = document.getElementById("filtro-vinculo");

        var h = "<h1>Acompanhamento da equipe</h1>"
            + '<p class="sub">Atualizado em 17/11/2026 · mostrando: <strong>' + esc(filtro.options[filtro.selectedIndex].text) + "</strong>. "
            + "Tudo o que você muda fica salvo neste navegador até baixar e aplicar no terminal.</p>"
            + '<div class="kpis">'
            + '<div class="kpi"><div class="v">' + tot.abertas + '</div><div class="l">Issues abertas</div></div>'
            + '<div class="kpi"><div class="v">' + tot.atencao + '</div><div class="l">⚠ 91–180 dias</div></div>'
            + '<div class="kpi"><div class="v">' + tot.parada + '</div><div class="l">⛔ &gt; 180 dias</div></div>'
            + '<div class="kpi"><div class="v">' + semResp + '</div><div class="l">Sem responsável</div></div>'
            + "</div>";
        h += '<div class="table-responsive"><table class="t"><thead><tr><th>Pessoa</th><th class="text-end">Abertas</th>'
            + '<th class="text-end">Resolvidas</th><th class="text-end">Mais antiga</th></tr></thead><tbody>';
        lista.forEach(function (x) {
            h += '<tr class="clicavel" data-ir="p-' + esc(x.p.id) + '"><td><a href="#p-' + esc(x.p.id) + '">' + esc(x.p.nome) + "</a>"
                + (x.r.alteradas ? ' <span class="pill mud">' + x.r.alteradas + " mudança(s)</span>" : "")
                + ' <small class="zero">' + esc(VINCULO[x.p.vinculo] || "") + "</small></td>"
                + '<td class="num">' + x.r.abertas.length + "</td>"
                + '<td class="num">' + x.p.resolvidas_total + "</td>"
                + '<td class="num">' + (x.r.maisAntiga !== null ? x.r.maisAntiga + " d" : "—") + "</td></tr>";
        });
        return h + "</tbody></table></div>";
    }

    function vistaTriagem() {
        var lista = todas().filter(function (i) { return !i.responsavel; }).sort(porIdade);
        return "<h1>Sem responsável</h1>"
            + '<p class="sub">Arraste um card para o nome de alguém no menu, ou use 👤.</p>'
            + barra(false) + grade(lista, false);
    }

    function vistaMudancas() {
        var lista = Object.keys(mudancas).sort().filter(function (c) { return mudancas[c].nova || issuesBase[c]; }).map(efetiva);
        return "<h1>Mudanças pendentes</h1>"
            + '<p class="sub">Revise antes de baixar. Depois: <code>python3 bin/aplicar_mudancas.py ~/Downloads/mudancas-….json</code></p>'
            + (lista.length ? grade(lista, true) : "<p>Nenhuma mudança feita ainda.</p>");
    }

    function chips(p, r) {
        var s = [];
        var velhas = r.c.atencao + r.c.parada;
        if (velhas) s.push(["p-critical", "⛔ " + velhas + " há mais de 90 dias"]);
        if (D.media_peso && p.vinculo === "servidor" && p.peso >= 1.5 * D.media_peso)
            s.push(["p-warning", "⚠ carga " + (p.peso / D.media_peso).toFixed(1) + "× a média"]);
        if (p.unicas >= 5) s.push(["p-warning", "⚠ único responsável em " + p.unicas + " tarefas"]);
        if (p.resolvidas90.length) s.push(["p-good", "✓ " + p.resolvidas90.length + " resolvida(s) em 90 dias"]);
        else if (r.abertas.length) s.push(["p-info", "nenhuma resolvida em 90 dias"]);
        return s.map(function (x) { return '<span class="pill ' + x[0] + '">' + esc(x[1]) + "</span>"; }).join("");
    }

    function vistaPessoa(p) {
        var r = resumoPessoa(p.nome);
        var abertas = r.lista.filter(function (i) { return !i.fechar; });
        var fechadas = r.lista.filter(function (i) { return i.fechar; });

        var h = '<div class="cab"><h1>' + esc(p.nome) + '</h1><span class="sub">' + esc(VINCULO[p.vinculo] || "") + "</span></div>"
            + '<div class="numeros"><span><b>' + abertas.length + "</b> abertas</span><span><b>" + p.atividades.length
            + "</b> tarefas</span><span>peso <b>" + p.peso + "</b> (média " + D.media_peso + ")</span></div>"
            + '<div class="chips">' + chips(p, r) + "</div>";

        h += barra(true) + formNova(p) + grade(abertas, false);
        if (fechadas.length) h += '<div class="secao">Serão fechadas (' + fechadas.length + ")</div>" + grade(fechadas, false);

        h += '<details class="bloco mt-4"><summary>Tarefas (' + p.atividades.length + ")</summary>"
            + '<table class="t mt-2"><tbody>' + p.atividades.map(function (a) {
                return '<tr><td><a href="index.html#' + esc(a.codigo) + '">' + esc(a.codigo) + "</a></td><td>" + esc(a.titulo)
                    + (a.unico ? ' <span class="pill p-warning">único resp.</span>' : "") + '</td><td class="zero">' + esc(a.papel)
                    + '</td><td class="num">peso ' + a.peso + "</td></tr>";
            }).join("") + "</tbody></table></details>";
        h += '<details class="bloco"><summary>Resolvidas nos últimos 90 dias (' + p.resolvidas90.length + ")</summary>"
            + (p.resolvidas90.length ? '<ul class="mt-2">' + p.resolvidas90.map(function (i) {
                return "<li><strong>" + esc(i.codigo) + "</strong> — " + esc(i.descricao) + ' <small class="zero">(' + esc(i.data_fechamento) + ")</small></li>";
            }).join("") + "</ul>" : '<p class="sub mt-2">Nenhuma.</p>') + "</details>";
        return h;
    }

    // ---------------- render ----------------
    function vistaAtual() { return (location.hash || "#equipe").slice(1); }
    function pessoaAtual() {
        var v = vistaAtual();
        return D.pessoas.filter(function (x) { return "p-" + x.id === v; })[0] || null;
    }

    function renderLateral() {
        var n = totalMudancas();
        var btn = document.getElementById("btn-baixar");
        btn.disabled = !n;
        btn.textContent = n ? "⬇ Baixar mudanças (" + n + ")" : "Sem mudanças para baixar";
        btn.className = "btn btn-sm mb-1 " + (n ? "btn-primary" : "btn-outline-secondary");
        document.getElementById("btn-limpar").disabled = !n;
        document.getElementById("status-mudancas").textContent = n
            ? n + " mudança(s) salvas neste navegador" : "Nenhuma mudança pendente";

        var ts = todas();
        document.getElementById("cont-equipe").textContent = ts.filter(function (i) { return !i.fechar; }).length;
        document.getElementById("cont-triagem").textContent = ts.filter(function (i) { return !i.responsavel && !i.fechar; }).length;
        var cm = document.getElementById("cont-mudancas");
        cm.textContent = n; cm.classList.toggle("mudou", !!n);

        var lista = pessoasFiltradas().map(function (p) { return { p: p, r: resumoPessoa(p.nome) }; })
            .sort(function (a, b) { return b.r.prioridade - a.r.prioridade || a.p.nome.localeCompare(b.p.nome); });
        document.getElementById("lista-pessoas").innerHTML = lista.map(function (x) {
            return '<a href="#p-' + esc(x.p.id) + '" class="item" data-vista="p-' + esc(x.p.id) + '" data-drop-pessoa="' + esc(x.p.nome) + '">'
                + esc(x.p.nome) + ' <span class="cont' + (x.r.alteradas ? " mudou" : "") + '">' + x.r.abertas.length + "</span></a>";
        }).join("") || '<div class="sub px-2">Ninguém neste filtro.</div>';

        var v = vistaAtual();
        document.querySelectorAll("nav.lateral a.item[data-vista]").forEach(function (a) {
            a.classList.toggle("ativo", a.dataset.vista === v);
        });
    }

    function render(manterScroll) {
        PREVISTOS = codigosPrevistos();
        var y = window.scrollY, v = vistaAtual(), html;
        if (v === "triagem") html = vistaTriagem();
        else if (v === "mudancas") html = vistaMudancas();
        else if (pessoaAtual()) html = vistaPessoa(pessoaAtual());
        else html = vistaEquipe();
        document.getElementById("main").innerHTML = html;
        renderLateral();
        window.scrollTo(0, manterScroll ? y : 0);
        var foco = document.getElementById("ed-valor") || document.getElementById("nova-tarefa");
        if (foco) foco.focus();
    }

    // ---------------- ações ----------------
    function fechar(cod) { registrar(cod, "fechar", true); editor = null; toast("✓ " + (cod.indexOf("nova-") === 0 ? "Nova issue descartada" : cod + " será fechada")); }
    function atribuir(cod, nome) {
        var i = efetiva(cod);
        if (i.responsavel === nome) return;
        registrar(cod, "responsavel", i.nova ? nome : (nome === issuesBase[cod].responsavel ? undefined : nome));
        toast((i.nova ? "Nova issue" : cod) + " → " + (nome || "sem responsável"));
    }

    var main = document.getElementById("main");
    main.addEventListener("click", function (e) {
        var t = e.target.closest("button, tr[data-ir]");
        if (!t) return;
        if (t.dataset.desfazer) { desfazer(t.dataset.desfazer); editor = null; render(true); toast("Mudança desfeita"); return; }
        if (t.dataset.nova) { editor = { acao: "nova" }; render(true); return; }
        if (t.dataset.acao) {
            var cod = t.dataset.issue;
            if (t.dataset.acao === "fechar") fechar(cod);
            else if (t.dataset.acao === "reabrir") { registrar(cod, "fechar", undefined); editor = null; }
            else editor = { issue: cod, acao: t.dataset.acao };
            render(true);
            return;
        }
        if (t.dataset.ed === "cancelar") { editor = null; render(true); return; }
        if (t.dataset.ed === "comentar" && editor) {
            var txt = document.getElementById("ed-valor").value.trim();
            if (!txt) { toast("Escreva o comentário"); return; }
            adicionarComentario(editor.issue, txt);
            render(true); toast("Comentário adicionado às mudanças");
            return;
        }
        if (t.dataset.rmcom !== undefined) {
            removerComentario(t.dataset.issue, parseInt(t.dataset.rmcom, 10));
            render(true); toast("Comentário removido");
            return;
        }
        if (t.dataset.ed === "criar") {
            var codTarefa = resolverTarefa(document.getElementById("nova-tarefa").value);
            if (!codTarefa) { toast("Tarefa não encontrada ou ambígua — escolha na lista"); document.getElementById("nova-tarefa").focus(); return; }
            var desc = document.getElementById("nova-desc").value.trim();
            if (!desc) { toast("Escreva a descrição"); document.getElementById("nova-desc").focus(); return; }
            var resp = resolverPessoa(document.getElementById("nova-resp").value);
            if (resp === null) { toast("Responsável não encontrado ou ambíguo — escolha na lista"); document.getElementById("nova-resp").focus(); return; }
            novaIssue(codTarefa, desc, resp);
            editor = null; render(true); toast("Nova issue adicionada às mudanças");
            return;
        }
        if (t.dataset.ed === "ok" && editor) {
            var valor = document.getElementById("ed-valor").value, c = editor.issue, i = efetiva(c);
            if (editor.acao === "atribuir") {
                var nome = resolverPessoa(valor);
                if (nome === null) { toast("Pessoa não encontrada ou ambígua — escolha na lista"); return; }
                atribuir(c, nome);
            }
            else if (editor.acao === "editar") {
                valor = valor.trim();
                if (!valor) { toast("A descrição não pode ficar vazia"); return; }
                registrar(c, "descricao", !i.nova && valor === issuesBase[c].descricao ? undefined : valor);
                toast("Descrição alterada");
            } else if (editor.acao === "mover") {
                valor = resolverTarefa(valor);
                if (!valor) { toast("Tarefa não encontrada ou ambígua — escolha na lista"); return; }
                registrar(c, "tarefa", !i.nova && valor === issuesBase[c].tarefa ? undefined : valor);
                toast("Movida para " + valor);
            }
            editor = null; render(true);
            return;
        }
        if (t.dataset.ir && e.target.tagName !== "A") location.hash = t.dataset.ir;
    });

    // Enter num campo de autocomplete confirma o editor aberto
    main.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
        var b = main.querySelector('[data-ed="ok"], [data-ed="criar"]');
        if (b && e.target.id !== "nova-tarefa") { e.preventDefault(); b.click(); }
    });

    // ---------------- arrastar e soltar ----------------
    function alvos() { return document.querySelectorAll("#zona-fechar, nav.lateral [data-drop-pessoa]"); }
    main.addEventListener("dragstart", function (e) {
        var c = e.target.closest && e.target.closest("[data-card]");
        if (!c || (editor && editor.issue === c.dataset.card)) { e.preventDefault(); return; }
        arrastando = c.dataset.card;
        e.dataTransfer.setData("text/plain", arrastando);
        e.dataTransfer.effectAllowed = "move";
        c.classList.add("arrastando");
        alvos().forEach(function (a) { a.classList.add(a.id === "zona-fechar" ? "ativa" : "alvo"); });
    });
    document.addEventListener("dragend", function () {
        arrastando = null;
        document.querySelectorAll(".arrastando").forEach(function (c) { c.classList.remove("arrastando"); });
        alvos().forEach(function (a) { a.classList.remove("ativa", "alvo", "sobre", "alvo-sobre"); });
    });
    document.addEventListener("dragover", function (e) {
        if (!arrastando) return;
        var a = e.target.closest && e.target.closest("#zona-fechar, [data-drop-pessoa]");
        alvos().forEach(function (x) { x.classList.remove("sobre", "alvo-sobre"); });
        if (!a) return;
        e.preventDefault();
        a.classList.add(a.id === "zona-fechar" ? "sobre" : "alvo-sobre");
    });
    document.addEventListener("drop", function (e) {
        if (!arrastando) return;
        var a = e.target.closest && e.target.closest("#zona-fechar, [data-drop-pessoa]");
        if (!a) return;
        e.preventDefault();
        var cod = arrastando;
        arrastando = null;
        if (a.id === "zona-fechar") fechar(cod);
        else atribuir(cod, a.dataset.dropPessoa);
        editor = null;
        render(true);
    });

    // ---------------- painel de mudanças ----------------
    document.getElementById("filtro-vinculo").addEventListener("change", function (e) {
        gravarStorage(CHAVE_FILTRO, e.target.value);
        render(false);
    });

    document.getElementById("btn-baixar").addEventListener("click", function () {
        var lista = Object.keys(mudancas).sort().map(function (cod) {
            var m = mudancas[cod];
            return m.nova ? { issue: null, nova: true, depois: m.depois, em: m.em }
                          : { issue: cod, antes: m.antes, depois: m.depois, em: m.em };
        });
        var agora = new Date();
        var obj = { tipo: "mudancas-acompanhamento", versao: 1, gerado_em: agora.toISOString(), mudancas: lista };
        var blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "mudancas-" + D.hoje + "-" + String(agora.getHours()).padStart(2, "0") + String(agora.getMinutes()).padStart(2, "0") + ".json";
        a.click();
        URL.revokeObjectURL(a.href);
        toast("Arquivo baixado. As mudanças continuam aqui até você aplicar ou limpar.");
    });

    document.getElementById("btn-limpar").addEventListener("click", function () {
        var n = totalMudancas();
        if (!n) return;
        if (!confirm("Apagar as " + n + " mudança(s) pendente(s) deste navegador?\n\nIsso não pode ser desfeito. Se ainda não aplicou, baixe o arquivo antes.")) return;
        mudancas = {};
        salvar();
        editor = null;
        render(true);
        toast("Mudanças apagadas");
    });

    window.addEventListener("hashchange", function () { editor = null; render(false); });
    window.addEventListener("storage", function (e) {
        if (e.key === CHAVE) { mudancas = lerStorage(CHAVE, {}); render(true); }
    });

    document.getElementById("filtro-vinculo").value =
        ["servidor", "estagiario", "todos"].indexOf(lerStorage(CHAVE_FILTRO, "")) >= 0 ? lerStorage(CHAVE_FILTRO, "") : "servidor";
    render(false);
})();
</script>

</body>
</html>
